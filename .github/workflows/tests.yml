name: tests

on:
    pull_request:
    push:
        branches:
            - main
            - next-gen
    workflow_dispatch:

# The unreleased javaabu/* dependencies come from VCS repositories; the job's own
# token keeps Composer within GitHub's API limits
env:
    COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
    pint:
        runs-on: ubuntu-latest

        name: Pint and dependencies

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer downloads
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('composer.json', 'composer.lock') }}
                    restore-keys: |
                        composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
                        composer-${{ runner.os }}-${{ github.job }}-

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-progress

            -   name: Check code style
                run: vendor/bin/pint --test

            # javaabu/helpers pins javaabu/settings ^1, which breaks installs next to settings v2
            -   name: No javaabu/helpers or javaabu/settings ^1 in production dependencies
                run: |
                    tree="$(composer show --tree --no-dev)"
                    if echo "$tree" | grep -E 'javaabu/helpers'; then
                        echo "javaabu/activitylog must not depend on javaabu/helpers"
                        exit 1
                    fi
                    if echo "$tree" | grep -E 'javaabu/settings (\^|~)?1'; then
                        echo "javaabu/activitylog must not depend on javaabu/settings ^1"
                        exit 1
                    fi

    js:
        runs-on: ubuntu-latest

        name: React pages (typecheck, tests)

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            # @javaabu/filters and @javaabu/stencil come from their Composer packages in vendor/
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer downloads
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('composer.json', 'composer.lock') }}
                    restore-keys: |
                        composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
                        composer-${{ runner.os }}-${{ github.job }}-

            -   name: Install Composer dependencies
                run: composer update --prefer-dist --no-interaction --no-progress

            -   name: Setup pnpm
                uses: pnpm/action-setup@v4

            -   name: Setup Node
                uses: actions/setup-node@v5
                with:
                    node-version: 22
                    package-manager-cache: false

            # The default store is inside a node_modules folder, which breaks the declaration
            # build of @javaabu/forms (installed from git and built on install)
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"

            -   name: Typecheck
                run: pnpm typecheck

            -   name: Test
                run: pnpm test

    without-translatable:
        runs-on: ubuntu-latest

        name: Tests without javaabu/translatable

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer downloads
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('composer.json', 'composer.lock') }}
                    restore-keys: |
                        composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
                        composer-${{ runner.os }}-${{ github.job }}-

            -   name: Install dependencies without javaabu/translatable
                run: |
                    composer remove --dev javaabu/translatable --no-update
                    composer update --prefer-dist --no-interaction --no-progress

            -   name: Execute tests
                run: vendor/bin/phpunit --testsuite "Test Suite"

    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.4, 8.5 ]
                laravel: [ 12.*, 13.* ]
                stability: [ prefer-lowest, prefer-stable ]
                include:
                    -   laravel: 12.*
                        testbench: 10.*
                    -   laravel: 13.*
                        testbench: 11.*

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

        env:
            COVERAGE: ${{ matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
                    coverage: ${{ env.COVERAGE == 'true' && 'pcov' || 'none' }}

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer downloads
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('composer.json', 'composer.lock') }}
                    restore-keys: |
                        composer-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
                        composer-${{ runner.os }}-${{ github.job }}-

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                    composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

            -   name: Execute tests
                if: env.COVERAGE != 'true'
                run: vendor/bin/phpunit

            -   name: Execute tests with coverage
                if: env.COVERAGE == 'true'
                run: vendor/bin/phpunit --coverage-clover build/coverage.xml

            -   name: Upload coverage to Codecov
                if: env.COVERAGE == 'true'
                uses: codecov/codecov-action@v5
                with:
                    files: build/coverage.xml
                    fail_ci_if_error: false
                    token: ${{ secrets.CODECOV_TOKEN }}
